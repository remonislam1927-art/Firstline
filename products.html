<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

    Firstline Products

  <!-- CSS -->

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="responsive.css" />
  <link rel="stylesheet" href="products.css">

  <!-- FONT AWESOME -->

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta

>

<meta
  name="keywords"
  content="Firstline, gadgets, shopping, affiliate products, smartwatches, earbuds, gaming accessories"
>

<meta
  name="author"
  content="Md Remon Islam"
>

<meta
  property="og:title"
  content="Firstline"
>

<meta
  property="og:description"
  content="Modern product discovery platform with shopping guides and trending gadgets."
>

<meta
  property="og:type"
  content="website"
>

<meta
  property="og:image"
  content="YOUR_LOGO_OR_BANNER_LINK"
>
<link rel="icon" type="image/x-icon" href="app_icon.ico">
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar">

  <!-- FILTER BUTTON -->
  <button class="open-filter-btn" onclick="openFilterPanel()">
    ☰ Filters
  </button>

  <!-- LOGO -->
<div class="logo">
    <img src="app_icon.ico" alt="">
    <h2>Firstline</h2>
</div>


  <!-- SEARCH -->
  <div class="search-box">
    <i class="fa-solid fa-magnifying-glass"></i>

    <input
      type="text"
      placeholder="Search products..."
      id="searchInput"
    />
  </div>

</nav>

<!-- ================= FILTER PANEL ================= -->

<div id="filterOverlay" class="filter-overlay" onclick="closeFilterPanel()"></div>

<div id="filterPanel" class="filter-panel">

  <!-- HEADER -->
  <div class="filter-header">
    <h3>Filters</h3>

    <!-- CLOSE BUTTON -->
    <button class="close-btn" onclick="closeFilterPanel()">✕</button>
  </div>

<!-- CATEGORY -->
<div class="filter-section">
  <h4>Category</h4>

  <label><input type="checkbox" onchange="setCategory('All')"> All</label>
  <label><input type="checkbox" onchange="setCategory('Fashion')"> Fashion</label>
  <label><input type="checkbox" onchange="setCategory('Electronics')"> Electronics</label>
  <label><input type="checkbox" onchange="setCategory('Accessories')"> Accessories</label>
  <label><input type="checkbox" onchange="setCategory('Gaming')"> Gaming</label>
  <label><input type="checkbox" onchange="setCategory('Beauty')"> Beauty</label>
  <label><input type="checkbox" onchange="setCategory('Shoes')"> Shoes</label>
  <label><input type="checkbox" onchange="setCategory('Books')"> Books</label>
  <label><input type="checkbox" onchange="setCategory('Health')"> Health</label>
  <label><input type="checkbox" onchange="setCategory('Home & Kitchen')"> Home & Kitchen</label>
</div>


<!-- PLATFORM -->
<div class="filter-section">
  <h4>Platform</h4>

  <label><input type="checkbox" onchange="setPlatform('All')"> All</label>

  <!-- SHOPPING -->
  <h5>🛍️ Shopping Platforms</h5>
  <label><input type="checkbox" onchange="setPlatform('Amazon')"> Amazon</label>
  <label><input type="checkbox" onchange="setPlatform('Flipkart')"> Flipkart</label>
  <label><input type="checkbox" onchange="setPlatform('Myntra')"> Myntra</label>
  <label><input type="checkbox" onchange="setPlatform('Ajio')"> Ajio</label>
  <label><input type="checkbox" onchange="setPlatform('Nykaa')"> Nykaa</label>

  <!-- TRAVEL -->
  <h5>✈️ Travel Platforms</h5>
  <label><input type="checkbox" onchange="setPlatform('MakeMyTrip')"> MakeMyTrip</label>
  <label><input type="checkbox" onchange="setPlatform('Goibibo')"> Goibibo</label>
  <label><input type="checkbox" onchange="setPlatform('Booking.com')"> Booking.com</label>
  <label><input type="checkbox" onchange="setPlatform('Agoda')"> Agoda</label>
  <label><input type="checkbox" onchange="setPlatform('Cleartrip')"> Cleartrip</label>

  <!-- FINANCIAL -->
  <h5>💳 Financial Platforms</h5>
  <label><input type="checkbox" onchange="setPlatform('HDFC Bank')"> HDFC Bank</label>
  <label><input type="checkbox" onchange="setPlatform('SBI Card')"> SBI Card</label>
  <label><input type="checkbox" onchange="setPlatform('Axis Bank')"> Axis Bank</label>
  <label><input type="checkbox" onchange="setPlatform('IDFC FIRST Bank')"> IDFC FIRST Bank</label>
  <label><input type="checkbox" onchange="setPlatform('Bajaj Finserv')"> Bajaj Finserv</label>

  <!-- SOFTWARE -->
  <h5>💻 Software & Services</h5>
  <label><input type="checkbox" onchange="setPlatform('GoDaddy')"> GoDaddy</label>
  <label><input type="checkbox" onchange="setPlatform('Hostinger')"> Hostinger</label>
  <label><input type="checkbox" onchange="setPlatform('Google Workspace')"> Google Workspace</label>
  <label><input type="checkbox" onchange="setPlatform('Canva')"> Canva</label>
  <label><input type="checkbox" onchange="setPlatform('Udemy')"> Udemy</label>

</div>

  <!-- PRICE RANGE (CUSTOM USER INPUT) -->
  <div class="filter-section">
    <h4>Price Range</h4>

    <input type="number" id="minPrice" placeholder="Min Price">
    <input type="number" id="maxPrice" placeholder="Max Price">

    <button onclick="applyCustomPrice()">Apply</button>
  </div>

</div>
<marquee><h2>Search for the products you want</h2></marquee>

    <!-- PRODUCTS GRID -->

<div class="products-grid" id="productsGrid">

</div>
    <div class="load-more-wrapper">

  <button id="loadMoreBtn">
    Load More
  </button>

  </section>


</div>

  <!-- JS -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDH9OmFLoba7e8Sr6Vz5lruPiJtvznTQ2Y",
  authDomain: "firstline-1927.firebaseapp.com",
  projectId: "firstline-1927",
  storageBucket: "firstline-1927.appspot.com",
  messagingSenderId: "240292512608",
  appId: "1:240292512608:web:1027ece3891e454def9405"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const productsGrid = document.getElementById("productsGrid");
const loadBtn = document.getElementById("loadMoreBtn");

// ================= STATE =================
let allProducts = [];
let searchResults = [];
let masterProducts = [];
let fuseIndex = null;
let searchTimeout = null;

let selectedCategory = "All";
let selectedPlatform = "All";
let minPrice = 0;
let maxPrice = Infinity;
let searchText = "";

// ================= MODE CONTROL =================
let mode = "browse";
let searchPage = 0;
const SEARCH_LIMIT = 20;

// ================= PAGINATION =================
let lastVisible = null;
let loading = false;
let reachedEnd = false;
const PRODUCTS_LIMIT = 20;
const loadedProductIds = new Set();

// ================= FILTER PANEL =================
function openFilterPanel() {
  document.getElementById("filterPanel").classList.add("active");
}

function closeFilterPanel() {
  document.getElementById("filterPanel").classList.remove("active");
}

// ================= LOAD PRODUCTS (BROWSE MODE ONLY) =================
async function loadProducts(reset = false) {

  if (loading || reachedEnd || mode === "search") return;

  loading = true;

  try {

    if (reset) {
      allProducts = [];
      productsGrid.innerHTML = "";
      loadedProductIds.clear();
      lastVisible = null;
      reachedEnd = false;
    }

    let baseQuery = db.collection("products")
      .orderBy("createdAt", "desc");

    if (selectedCategory !== "All") {
      baseQuery = db.collection("products")
        .where("category", "==", selectedCategory)
        .orderBy("createdAt", "desc");
    }

    let queryRef = baseQuery.limit(PRODUCTS_LIMIT);

    if (lastVisible) {
      queryRef = queryRef.startAfter(lastVisible);
    }

    const snapshot = await queryRef.get();

    if (snapshot.empty) {
      reachedEnd = true;
      loadBtn.style.display = "none";
      return;
    }

    lastVisible = snapshot.docs[snapshot.docs.length - 1];

    snapshot.forEach(doc => {
      if (!loadedProductIds.has(doc.id)) {
        loadedProductIds.add(doc.id);
        allProducts.push({ id: doc.id, ...doc.data() });
      }
    });

    renderProducts();

  } catch (error) {
    console.error("Error loading products:", error);
  } finally {
    loading = false;
  }
}

// ================= RENDER BROWSE =================
function renderProducts() {

  productsGrid.innerHTML = "";

  const fuse = new Fuse(allProducts, {
    keys: ["title", "desc", "category", "platform"],
    threshold: 0.4
  });

  const searchedProducts = searchText
    ? fuse.search(searchText).map(r => r.item)
    : allProducts;

  const filtered = searchedProducts.filter(p => {

    const priceValue = parseInt(p.price) || 0;

    const categoryMatch =
      selectedCategory === "All" ||
      (p.category || "").toLowerCase() === selectedCategory.toLowerCase();

    const platformMatch =
      selectedPlatform === "All" ||
      (p.platform || "").toLowerCase() === selectedPlatform.toLowerCase();

    const priceMatch =
      priceValue >= minPrice && priceValue <= maxPrice;

    return categoryMatch && platformMatch && priceMatch;
  });

  if (filtered.length === 0) {
    productsGrid.innerHTML = `
      <div class="no-products-found">
        <h2>No Products Found</h2>
        <p>Try searching something else.</p>
      </div>
    `;
    return;
  }

  const fragment = document.createDocumentFragment();

  filtered.forEach(product => {
    const div = document.createElement("div");
    div.className = "product-card";

    div.innerHTML = `
      <div class="product-image">
        <img src="${product.image}" loading="lazy">
        <div class="platform-tag ${product.platform}">
          ${product.platform}
        </div>
      </div>

      <div class="product-info">
        <h3>${product.title}</h3>
        <p>${product.desc}</p>

        <div class="product-bottom">
          <h4>₹${product.price}</h4>
          <a href="${product.link}" target="_blank">Buy Now</a>
        </div>
      </div>
    `;

    fragment.appendChild(div);
  });

  productsGrid.appendChild(fragment);
}

// ================= FULL DATABASE SEARCH ENGINE =================
async function initSearchEngine() {

  const snapshot = await db.collection("products")
    .orderBy("createdAt", "desc")
    .get();

  masterProducts = [];

  snapshot.forEach(doc => {
    masterProducts.push({ id: doc.id, ...doc.data() });
  });

  fuseIndex = new Fuse(masterProducts, {
    keys: ["title", "desc", "category", "platform"],
    threshold: 0.4
  });
}

// ================= SEARCH INPUT (0.1s FEEL FAST) =================
document.getElementById("searchInput")
.addEventListener("input", (e) => {

  const value = e.target.value.trim();

  clearTimeout(searchTimeout);

  searchTimeout = setTimeout(() => {

    searchText = value;

    if (!fuseIndex) return;

    // SWITCH MODE
    mode = value.length > 0 ? "search" : "browse";
    searchPage = 0;

    searchResults = value
      ? fuseIndex.search(value).map(r => r.item)
      : [];

    productsGrid.innerHTML = "";

    if (mode === "search") {
      renderSearchResults();
    } else {
      loadProducts(true);
    }

  }, 80); // ⚡ faster than Amazon feel
});

// ================= SEARCH RENDER =================
function renderSearchResults() {

  const start = searchPage * SEARCH_LIMIT;
  const end = start + SEARCH_LIMIT;

  const chunk = searchResults.slice(start, end);

  const fragment = document.createDocumentFragment();

  chunk.forEach(product => {

    const div = document.createElement("div");
    div.className = "product-card";

    div.innerHTML = `
      <div class="product-image">
        <img src="${product.image}" loading="lazy">
        <div class="platform-tag ${product.platform}">
          ${product.platform}
        </div>
      </div>

      <div class="product-info">
        <h3>${product.title}</h3>
        <p>${product.desc}</p>

        <div class="product-bottom">
          <h4>₹${product.price}</h4>
          <a href="${product.link}" target="_blank">Buy Now</a>
        </div>
      </div>
    `;

    fragment.appendChild(div);
  });

  productsGrid.appendChild(fragment);

  loadBtn.style.display =
    end >= searchResults.length ? "none" : "block";
}

// ================= FILTER FUNCTIONS =================
function setCategory(value) {
  selectedCategory = value;
  renderProducts();
}

function setPlatform(value) {
  selectedPlatform = value;
  renderProducts();
}

function applyCustomPrice() {
  minPrice = parseInt(document.getElementById("minPrice").value) || 0;
  maxPrice = parseInt(document.getElementById("maxPrice").value) || Infinity;
  renderProducts();
}

// ================= LOAD MORE =================
loadBtn.addEventListener("click", () => {

  if (mode === "browse") {
    loadProducts();
  }

  else if (mode === "search") {
    searchPage++;
    renderSearchResults();
  }
});

// ================= INIT =================
loadProducts();
initSearchEngine();

</script>
</body>

</html>
