<script>
const firebaseConfig = {
  apiKey: "AIzaSyDH9OmFLoba7e8Sr6Vz5lruPiJtvznTQ2Y",
  authDomain: "firstline-1927.firebaseapp.com",
  projectId: "firstline-1927",
  storageBucket: "firstline-1927.appspot.com",
  messagingSenderId: "240292512608",
  appId: "1:240292512608:web:1027ece3891e454def9405"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const productsGrid = document.getElementById("productsGrid");

// ================= STATE =================
let allProducts = [];

let selectedCategory = "All";

let selectedPlatform = "All";

let minPrice = 0;

let maxPrice = Infinity;

let searchText = "";

// ================= NEW PAGINATION STATES =================

let lastVisible = null;

let loading = false;

let reachedEnd = false;

const PRODUCTS_LIMIT = 20;

const loadedProductIds = new Set();

// ================= FILTER PANEL OPEN/CLOSE =================
function openFilterPanel() {
  document.getElementById("filterPanel").classList.add("active");
}

function closeFilterPanel() {
  document.getElementById("filterPanel").classList.remove("active");
}

// ================= LOAD =================
async function loadProducts(reset = false) {

  // ================= PREVENT MULTIPLE LOADS =================

  if (loading || reachedEnd) return;

  loading = true;

  try {

    // ================= RESET SYSTEM =================

    if (reset) {

      allProducts = [];

      productsGrid.innerHTML = "";

      loadedProductIds.clear();

      lastVisible = null;

      reachedEnd = false;
    }

    // ================= BASE QUERY =================

    let queryRef = db.collection("products")
      .orderBy("createdAt", "desc")
      .limit(PRODUCTS_LIMIT);

    // ================= CATEGORY FILTER =================

    if (selectedCategory !== "All") {

      queryRef = db.collection("products")
        .where("category", "==", selectedCategory)
        .orderBy("createdAt", "desc")
        .limit(PRODUCTS_LIMIT);
    }

    // ================= PAGINATION =================

    if (lastVisible) {

      queryRef = queryRef.startAfter(lastVisible);
    }

    // ================= FETCH DATA =================

    const snapshot = await queryRef.get();

    // ================= NO MORE PRODUCTS =================

    if (snapshot.empty) {

      reachedEnd = true;

      const loadBtn = document.getElementById("loadMoreBtn");

      if (loadBtn) {
        loadBtn.style.display = "none";
      }

      return;
    }

    // ================= SAVE LAST DOC =================

    lastVisible = snapshot.docs[snapshot.docs.length - 1];

    // ================= PREVENT DUPLICATES =================

    snapshot.forEach(doc => {

      if (!loadedProductIds.has(doc.id)) {

        loadedProductIds.add(doc.id);

        allProducts.push({
          id: doc.id,
          ...doc.data()
        });
      }
    });

    // ================= RENDER =================

    renderProducts();

  } catch (error) {

    console.error("Error loading products:", error);

  } finally {

    loading = false;
  }
}

// ================= RENDER =================
function renderProducts() {

  productsGrid.innerHTML = "";

  // ================= FUSE SEARCH =================

  const options = {
    keys: [
      "title",
      "desc",
      "category",
      "platform"
    ],
    threshold: 0.4,
    includeScore: true
  };

  const fuse = new Fuse(allProducts, options);

  const searchedProducts = searchText
    ? fuse.search(searchText).map(result => result.item)
    : allProducts;

  // ================= FILTER =================

  const filtered = searchedProducts.filter(p => {

    const priceValue = parseInt(p.price) || 0;

    const categoryMatch =
      selectedCategory === "All" ||
      (p.category || "").toLowerCase() === selectedCategory.toLowerCase();

    const platformMatch =
      selectedPlatform === "All" ||
      (p.platform || "").toLowerCase() === selectedPlatform.toLowerCase();

    const priceMatch =
      priceValue >= minPrice && priceValue <= maxPrice;

    return categoryMatch && platformMatch && priceMatch;
  });

  // ================= EMPTY STATE =================

  if (filtered.length === 0) {

    productsGrid.innerHTML = `
      <div class="no-products-found">
        <h2>No Products Found</h2>
        <p>Try searching something else.</p>
      </div>
    `;

    return;
  }

  // ================= PRODUCTS =================

  filtered.forEach(product => {

    productsGrid.innerHTML += `
      <div class="product-card">

        <div class="product-image">
          <img src="${product.image}" loading="lazy">

          <div class="platform-tag ${product.platform}">
            ${product.platform}
          </div>
        </div>

        <div class="product-info">
          <h3>${product.title}</h3>
          <p>${product.desc}</p>

          <div class="product-bottom">
            <h4>₹${product.price}</h4>

            <a 
              href="${product.link}" 
              target="_blank"
              rel="noopener noreferrer"
            >
              Buy Now
            </a>
          </div>
        </div>

      </div>
    `;
  });
}

// ================= FILTER FUNCTIONS =================
function setCategory(value) {
  selectedCategory = value;
  renderProducts();
}

function setPlatform(value) {
  selectedPlatform = value;
  renderProducts();
}

function applyCustomPrice() {
  minPrice = parseInt(document.getElementById("minPrice").value) || 0;
  maxPrice = parseInt(document.getElementById("maxPrice").value) || Infinity;
  renderProducts();
}

// ================= SEARCH =================
document.getElementById("searchInput")
.addEventListener("input", async (e) => {

  searchText = e.target.value.trim();

  productsGrid.innerHTML = "";

  allProducts = [];

  loadedProductIds.clear();

  lastVisible = null;

  reachedEnd = false;

  await loadProducts(true);
});
loadProducts();
document.getElementById("loadMoreBtn")
.addEventListener("click", () => {

  loadProducts();
});
</script>
