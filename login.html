<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login</title>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <link rel="stylesheet" href="login.css">
</head>

<body>

  <div class="login-container">

    <h2>Admin Login</h2>

    <form id="loginForm">

      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>

      <button type="submit">Login</button>

    </form>

    <p class="login-error" id="error"></p>

  </div>

<script>

// ================= FIREBASE CONFIG =================
const firebaseConfig = {
  apiKey: "AIzaSyDH9OmFLoba7e8Sr6Vz5lruPiJtvznTQ2Y",
  authDomain: "firstline-1927.firebaseapp.com",
  projectId: "firstline-1927",
  storageBucket: "firstline-1927.appspot.com",
  messagingSenderId: "240292512608",
  appId: "1:240292512608:web:1027ece3891e454def9405"
};

// INIT FIREBASE
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// ================= ADMIN EMAIL =================
const ADMIN_EMAIL = "remonislam1927@gmail.com";

// ================= LOGIN SYSTEM =================
document.getElementById("loginForm").addEventListener("submit", function(e){

  e.preventDefault(); // 🚫 stop page refresh

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const errorBox = document.getElementById("error");

  if(!email || !password){
    errorBox.textContent = "Please fill all fields";
    return;
  }

  auth.signInWithEmailAndPassword(email, password)
    .then((userCredential) => {

      const user = userCredential.user;

      // 🔐 ADMIN CHECK
      if(user.email !== ADMIN_EMAIL){
        errorBox.textContent = "Access denied: Not admin";
        auth.signOut();
        return;
      }

      // ✅ SUCCESS
      window.location.href = "admin.html";

    })
    .catch((err) => {
      errorBox.textContent = err.message;
    });

});

</script>

</body>
</html>
