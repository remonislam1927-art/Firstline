<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel</title>
<link rel="icon" type="image/x-icon" href="app_icon.ico">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="responsive.css">
<link rel="stylesheet" href="admin.css">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

</head>

<body>

<!-- 🔐 BLOCK UI UNTIL AUTH -->
<div id="blockedScreen" style="
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:#0f172a;
color:white;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
z-index:9999;
">
    <h2>🔐 Checking Access...</h2>
</div>

<section class="admin-panel" id="adminPanel" style="display:none;">
    <div class="admin-container">

        <!-- FORM -->
        <div class="admin-box">

            <h2>Add Product</h2>

            <input type="text" id="productTitle" placeholder="Product Title">
            <input type="text" id="productPrice" placeholder="Price">

            <input type="text" id="productImage" placeholder="Image URL">
            <input type="file" id="imageUpload" accept="image/*">

            <input type="text" id="productLink" placeholder="Affiliate Link">

            <textarea id="productDesc" placeholder="Description"></textarea>

            <!-- PLATFORM (DYNAMIC GROUPED) -->
<select id="productPlatform">

    <optgroup label="🛍️ Shopping Platforms">
        <option value="Amazon">Amazon</option>
        <option value="Flipkart">Flipkart</option>
        <option value="Myntra">Myntra</option>
        <option value="Ajio">Ajio</option>
        <option value="Nykaa">Nykaa</option>
    </optgroup>

    <optgroup label="✈️ Travel & Booking">
        <option value="MakeMyTrip">MakeMyTrip</option>
        <option value="Goibibo">Goibibo</option>
        <option value="Booking.com">Booking.com</option>
        <option value="Agoda">Agoda</option>
        <option value="Cleartrip">Cleartrip</option>
    </optgroup>

    <optgroup label="💳 Finance & Banking">
        <option value="HDFC Bank">HDFC Bank</option>
        <option value="SBI Card">SBI Card</option>
        <option value="Axis Bank">Axis Bank</option>
        <option value="IDFC FIRST Bank">IDFC FIRST Bank</option>
        <option value="Bajaj Finserv">Bajaj Finserv</option>
    </optgroup>

    <optgroup label="💻 Software & Services">
        <option value="GoDaddy">GoDaddy</option>
        <option value="Hostinger">Hostinger</option>
        <option value="Google Workspace">Google Workspace</option>
        <option value="Canva">Canva</option>
        <option value="Udemy">Udemy</option>
    </optgroup>

</select>
            <!-- CATEGORY -->
<select id="productCategory" onchange="updatePlatforms()">
    <option value="All">All</option>
    <option value="Fashion">Fashion</option>
    <option value="Electronics">Electronics</option>
    <option value="Accessories">Accessories</option>
    <option value="Gaming">Gaming</option>
    <option value="Beauty">Beauty</option>
    <option value="Shoes">Shoes</option>
    <option value="Books">Books</option>
    <option value="Health">Health</option>
    <option value="Home & Kitchen">Home & Kitchen</option>
    <option value="Services">Services</option>
    <option value="Finance">Finance</option>
    <option value="Travel">Travel</option>
</select>

            <button onclick="addProduct()">Save Product</button>

        </div>

        <!-- LIST -->
        <div class="admin-products-list" id="adminProducts"></div>

    </div>

</section>

<button onclick="logout()" class="logout-btn">Logout</button>

<script src="admin.js"></script>

<script>
    
const ADMIN_EMAIL = "remonislam1927@gmail.com";

// ================= FIREBASE =================
const firebaseConfig = {
  apiKey: "AIzaSyDH9OmFLoba7e8Sr6Vz5lruPiJtvznTQ2Y",
  authDomain: "firstline-1927.firebaseapp.com",
  projectId: "firstline-1927",
  storageBucket: "firstline-1927.appspot.com",
  messagingSenderId: "240292512608",
  appId: "1:240292512608:web:1027ece3891e454def9405"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const auth = firebase.auth();

// ================= STATE =================
let editId = null;
let uploadedImage = "";

// ================= PLATFORM GROUPS (NEW ADDITION) =================
const platformGroups = {
  "Shopping": [
    "Amazon",
    "Flipkart",
    "Myntra",
    "Ajio",
    "Nykaa"
  ],

  "Travel": [
    "MakeMyTrip",
    "Goibibo",
    "Booking.com",
    "Agoda",
    "Cleartrip"
  ],

  "Finance": [
    "HDFC Bank",
    "SBI Card",
    "Axis Bank",
    "IDFC FIRST Bank",
    "Bajaj Finserv"
  ],

  "Services": [
    "GoDaddy",
    "Hostinger",
    "Google Workspace",
    "Canva",
    "Udemy"
  ]
};
function filterPlatforms() {

    const inputEl = document.getElementById("platformSearchInput");
    const dropdown = document.getElementById("platformDropdown");

    if (!inputEl || !dropdown) return; // ⭐ SAFE FIX

    const input = inputEl.value.toLowerCase();
    const category = document.getElementById("productCategory").value;

    let group = "Shopping";

    if (category === "Travel") group = "Travel";
    else if (category === "Finance") group = "Finance";
    else if (category === "Services") group = "Services";

    const platforms = platformGroups[group];

    dropdown.innerHTML = "";

    platforms
        .filter(p => p.toLowerCase().includes(input))
        .forEach(p => {

            const div = document.createElement("div");
            div.innerText = p;

            div.onclick = () => {
                document.getElementById("productPlatform").value = p;
                document.getElementById("platformSearchInput").value = p;
                dropdown.innerHTML = "";
            };

            dropdown.appendChild(div);
        });
}

// ================= SECURE GUARD =================
auth.onAuthStateChanged(user => {

    if (!user) {
        window.location.href = "login.html";
        return;
    }

    if (user.email !== ADMIN_EMAIL) {
        alert("Access denied!");
        auth.signOut();
        window.location.href = "login.html";
        return;
    }

    document.getElementById("blockedScreen").style.display = "none";
    document.getElementById("adminPanel").style.display = "block";

    loadProducts();
    updatePlatforms(); // ⭐ AUTO LOAD FIRST TIME
});

// ================= IMAGE UPLOAD =================
document.getElementById("imageUpload").addEventListener("change", function(e){

    const file = e.target.files[0];
    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(event){
        uploadedImage = event.target.result;
    };

    reader.readAsDataURL(file);
});

// ================= LOAD =================
function loadProducts(){

    const container = document.getElementById("adminProducts");

db.collection("products")
.orderBy("createdAt","desc")
.limit(5)
.onSnapshot(snapshot => {

        container.innerHTML = "";

        snapshot.forEach(doc => {

            const p = doc.data();

            container.innerHTML += `
            <div class="admin-product-card">

                <img src="${p.image}" />

                <div class="admin-product-info">
                    <h3>${p.title}</h3>
                    <p>${p.desc}</p>
                    <h4>${p.price}</h4>
                    <span>${p.platform}</span>
                </div>

                <div class="admin-product-buttons">

                    <button onclick="editProduct('${doc.id}')">Edit</button>
                    <button onclick="deleteProduct('${doc.id}')">Delete</button>

                </div>

            </div>`;
        });
    });
}

// ================= ⭐ DYNAMIC PLATFORM SYSTEM (NEW) =================
function updatePlatforms() {
    // NO NEED TO CHANGE DOM
    // because optgroups already exist in HTML
    return;
}

// ================= ADD / UPDATE =================
function addProduct(){

    const title = productTitle.value.trim();
    const price = productPrice.value.trim();
    const imageUrl = productImage.value.trim();
    const link = productLink.value.trim();
    const desc = productDesc.value.trim();
    const platform = document.getElementById("productPlatform").value;

    if(!title || !price || !link){
        alert("Fill required fields");
        return;
    }

    const data = {
        title,
        price,
        image: uploadedImage || imageUrl,
        link,
        desc,
        platform,
        category: productCategory.value,
        createdAt: Date.now()
    };

    if(editId){
        db.collection("products").doc(editId).update(data);
        editId = null;
    } else {
        db.collection("products").add(data);
    }

    clearFields();
}

// ================= EDIT =================
function editProduct(id){

    db.collection("products").doc(id).get().then(doc => {

        const p = doc.data();

        productTitle.value = p.title;
        productPrice.value = p.price;
        productImage.value = p.image;
        productLink.value = p.link;
        productDesc.value = p.desc;

        productCategory.value = p.category || "Fashion";

        uploadedImage = p.image;
        editId = id;

        updatePlatforms(); // ⭐ IMPORTANT FIX
        setTimeout(() => {
            productPlatform.value = p.platform;
        }, 50);
    });
}

// ================= DELETE =================
function deleteProduct(id){
    db.collection("products").doc(id).delete();
}

// ================= CLEAR =================
function clearFields(){

    productTitle.value = "";
    productPrice.value = "";
    productImage.value = "";
    productLink.value = "";
    productDesc.value = "";

    uploadedImage = "";
    editId = null;

    productCategory.value = "Fashion";
    updatePlatforms();
}
function updatePlatformStats(products) {

    const counts = {};

    products.forEach(p => {
        const platform = p.platform || "Unknown";
        counts[platform] = (counts[platform] || 0) + 1;
    });

    const container = document.getElementById("platformStats");
    container.innerHTML = "";

    Object.keys(counts).forEach(platform => {

        const card = document.createElement("div");
        card.className = "platform-stat-card";

        card.innerHTML = `
            <h4>${platform}</h4>
            <p>${counts[platform]}</p>
        `;

        container.appendChild(card);
    });
}
</script>
</body>
</html>
